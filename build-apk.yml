name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java (necessário pro Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências do Capacitor
        run: npm install

      - name: Adicionar a plataforma Android
        run: npx cap add android

      - name: Copiar os arquivos web pro projeto Android
        run: npx cap sync android

      - name: Compilar o APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: aquaflow-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
